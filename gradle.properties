# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=com.onthehill.xaeroworldmapbook

# Dependencies
fabric_api_version=0.157.0+26.2

# Soft dependency for the Mod Menu integration in
# client.XaeroWorldMapBookMenuIntegration — see minecraft-config-standards.md's
# "Soft Dependency on Mod Menu" section. This was originally guessed
# (11.0.3+26.2) rather than checked against a real release — an earlier
# oversight. Set to 20.0.1 per the project owner's own confirmed real
# check against https://modrinth.com/mod/modmenu on 2026-08-15. If a
# build failure persists after that correction, the failure is not the
# version string — see build.gradle's dependency-scope comment and
# repositories block for the two other fixes made alongside this one.
modmenu_version=20.0.1

# Xaero's World Map (hard dependency) and Xaero's Minimap (soft dependency) —
# see client.integration.XaeroWorldMapBridge / XaeroMinimapVisibilityHook.
# Both pinned to the real, current releases for minecraft_version=26.2,
# looked up via the Modrinth API (api.modrinth.com/v2/project/<slug>/version)
# on 2026-08-21 — not guessed. Both mods publish to
# https://chocolateminecraft.com/maven (see build.gradle's repositories block).
xaero_world_map_version=1.45.0
xaero_minimap_version=26.4.2

# Test framework — see build.gradle's testImplementation block.
# Verify this is still the latest 5.x release before relying on it long-term.
junit_version=5.10.2
